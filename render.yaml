services:
  - type: web
    name: lunex-scripts
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lunex-db
          property: connectionString
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_EMAILS
        sync: false
databases:
  - name: lunex-db
    plan: free
    databaseName: lunex
    user: lunex_user
